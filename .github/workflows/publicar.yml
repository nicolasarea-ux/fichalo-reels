name: Publicar Reels
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: publicar
  cancel-in-progress: false
jobs:
  publicar:
    runs-on: ubuntu-latest
    if: ${{ vars.PUBLICADOR_ACTIVO == 'si' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Publicar los Reels que tocan
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: python3 publicar.py
      - name: Guardar estado
        run: |
          git config user.name "fichalo-bot"
          git config user.email "fichalo-bot@users.noreply.github.com"
          git add publicaciones.json
          git diff --cached --quiet || (git commit -m "Reels publicados" && git pull --rebase && git push)

  renovar-token:
    # el token de Instagram dura 60 días; se renueva cada lunes y se guarda en el secreto
    runs-on: ubuntu-latest
    if: ${{ vars.PUBLICADOR_ACTIVO == 'si' && github.event.schedule == '*/15 * * * *' }}
    steps:
      - name: Renovar si es lunes a las 6:00 UTC
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ "$(date -u +%u%H%M)" \< "1060000" ] || [ "$(date -u +%u%H%M)" \> "1061400" ]; then exit 0; fi
          NEW=$(curl -s "https://graph.instagram.com/refresh_access_token?grant_type=ig_refresh_token&access_token=$IG_TOKEN" | python3 -c "import sys,json;print(json.load(sys.stdin)['access_token'])")
          gh secret set IG_TOKEN --body "$NEW" --repo ${{ github.repository }}
